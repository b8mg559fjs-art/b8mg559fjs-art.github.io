<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aggregates Pricing App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client for Secure Authentication -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center px-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight">🏗️ Authorized Access</h1>
            <p class="text-slate-400 text-sm mt-1">Sign in to access the Hyderabad Aggregates Pricing Engine.</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div id="errorMessage" class="text-red-400 text-sm hidden"></div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                Secure Sign In
            </button>
        </form>
    </div>

    <script>
        // Initialize Supabase (Replace with your free project credentials from supabase.com)
        const SUPABASE_URL = 'https://esbudkswhcrhapgcybot.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_x4iGGll5OJSDpeOfwQvKDA_uo21kDNi';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.classList.add('hidden');

            // Authenticate securely against Supabase backend database
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorDiv.innerText = error.message;
                errorDiv.classList.remove('hidden');
            } else {
                // If login is successful, redirect authorized user to the calculator page
                window.location.href = 'calculator.html';
            }
        }

        // Check if already logged in
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                window.location.href = 'calculator.html';
            }
        });
    </script>
</body>
</html>
